<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webflow - Own your templates</title>
    <link rel="shortcut icon" href="icon.png" type="image/png">
    <style>
        /* *{ xbox-sizing: border-box;} */
        :root {
            --primary: #4E47FF;
            --secoundary: #252432;
            --secoundary2: #8987A1;
        }

        body {
            padding: 0;
            margin: 0;
            background: #F5F8FF;
        }

        .container {
            max-width: 1140px;
            width: 90%;
            margin: 0 auto;
        }

        header {
            background-image: url('Assets/Hero-bg.png');
            min-height: 600px;
            background-repeat: no-repeat;
            background-size: cover;
            margin-bottom: 120px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 50px 0;
        }

        .logo {
            font-size: 34px;
            line-height: 150%;
            font-weight: 900;
            color: var(--primary);
        }

        button {
            border: 0;
            padding: 1em 2em;
            background-color: var(--primary);
            color: white;
            border-radius: 10px;
            font-weight: bold;
            transition: background-color 0.5s ease-in-out;
        }

        button:hover {
            background-color: #837eff
        }



        .hero {
            /* margin-top: 150px; */
            padding: 150px 0;
            text-align: center;
            max-width: 900px;
        }

        .hero h1 {
            font-weight: bold;
            font-size: 65px;
            color: var(--secoundary);
        }





        a {
            all: unset;
            cursor: pointer;
        }

        a:visited {
            all: unset;

        }

        a:hover {
            text-decoration: underline;
        }


        footer .nav_parent {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            /* border: 1px solid red; */
            color: var(--secoundary2);
            padding: 103px 0;
        }

        footer .nav_section {
            max-width: 530px;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .footer_logo {
            font-size: 100px;
            font-weight: 900;
            color: var(--primary);
        }



        .footer_navs {
            margin: 20px 0;
            display: flex;
            gap: 2em;
        }

        .footer_contact {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3em;
            justify-content: space-between;
            margin-bottom: 3em;
            align-items: center;
        }


        .get_in_touch {
            font-size: 97px;
            color: black;
        }

        form {
            display: flex;
            flex-direction: column;
            justify-content: left;
            gap: 1em;
            padding: 3em;
        }

        input,
        textarea {
            box-sizing: border-box;
            width: 100%;
            border: 1px solid #ccc;
            padding: 1em;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <header>
        <section class="container navbar">
            <div class="logo">WEBFLOW</div>
            <div><button>Signup</button></div>
        </section>
        <section class="container hero">
            <h1>Cool Dark UI Template for Webflow Agencies!</h1>
            <button>Stay Focused</button>
        </section>
    </header>



    <footer class=" ">
        <section class="container footer_contact">
            <div class="get_in_touch">
                Let’s Get in Touch
            </div>
            <form>
                <div>
                    <div style="font-weight: 600; padding: 5px">Email</div>
                    <div><input type="email" name="email" id="email" placeholder="example@email.com"></div>
                </div>
                <div>
                    <div style="font-weight: 600; padding: 5px">Name</div>
                    <div><input type="text" name="name" id="name" placeholder="John Doe"></div>
                </div>
                <div>
                    <div style="font-weight: 600; padding: 5px">Message</div>
                    <div><textarea name="message" id="message" placeholder="write your message..." rows="6"></textarea>
                    </div>
                </div>
                <div>
                    <button style="width:100%">Get in Touch</button>
                </div>
            </form>
        </section>
        <section style="background-color: white; width: 100%;" class="nav_parent">
            <div class="nav_section">

                <div class="footer_logo">WEBFLOW</div>
                <div>
                    Ready to elevate your online presence? Contact us today to discuss your project and discover how we
                    can
                    bring your vision to life.
                </div>
                <div class="footer_navs">

                    <a href="#">About</a>
                    <a href="#">How it Works</a>
                    <a href="#">Services</a>
                    <a href="#">Home</a>

                </div>
            </div>

        </section>
    </footer>
</body>

</html>
