<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webflow - Own your templates</title>
    <link rel="shortcut icon" href="icon.png" type="image/png">
    <style>
        /* *{ xbox-sizing: border-box;} */
        :root {
            --primary: #4E47FF;
            --secoundary: #252432;
            --secoundary2: #8987A1;
        }

        body {
            padding: 0;
            margin: 0;
            background: #F5F8FF;
        }

        .container {
            max-width: 1140px;
            width: 90%;
            margin: 0 auto;
        }

        header {
            background-image: url('Assets/Hero-bg.png');
            min-height: 600px;
            background-repeat: no-repeat;
            background-size: cover;
            margin-bottom: 120px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 50px 0;
        }

        .logo {
            font-size: 34px;
            line-height: 150%;
            font-weight: 900;
            color: var(--primary);
        }

        button {
            border: 0;
            padding: 1em 2em;
            background-color: var(--primary);
            color: white;
            border-radius: 10px;
            font-weight: bold;
            transition: background-color 0.5s ease-in-out;
        }

        button:hover {
            background-color: #837eff
        }

       
    </style>
</head>

<body>
    <header>
        <section class="container navbar">
            <div class="logo">WEBFLOW</div>
            <div><button>Signup</button></div>
        </section>
        <section class="container hero">
            <h1>Cool Dark UI Template for Webflow Agencies!</h1>
            <button>Stay Focused</button>
        </section>
    </header>
    
</body>

</html>
